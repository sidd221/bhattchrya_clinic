<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="35%" stop-color="#F5F0E6" />
      <stop offset="70%" stop-color="#EFF6F0" />
      <stop offset="100%" stop-color="#F8F5EE" />
    </linearGradient>

    <!-- Warm Golden Morning Glow -->
    <radialGradient id="sun-glow" cx="85%" cy="15%" r="65%">
      <stop offset="0%" stop-color="#F7EBD4" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#FAF1E3" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#FAF8F5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </radialGradient>

    <!-- Calming Sage Green Ambient Light -->
    <radialGradient id="sage-glow" cx="15%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#D9EADE" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#EAF2EC" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FAF8F5" stop-opacity="0" />
    </radialGradient>

    <!-- Top Left Gentle Aura -->
    <radialGradient id="vitality-glow" cx="20%" cy="10%" r="45%">
      <stop offset="0%" stop-color="#E4EFE7" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#FAF8F5" stop-opacity="0" />
    </radialGradient>

    <!-- Leaf Gradients -->
    <linearGradient id="leaf-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D684D" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#1B4231" stop-opacity="0.08" />
    </linearGradient>
    <linearGradient id="leaf-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7D5C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#559976" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="gold-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A675" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E2CCA8" stop-opacity="0.06" />
    </linearGradient>

    <!-- Subtle Ring Gradients -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D684D" stop-opacity="0.12" />
      <stop offset="50%" stop-color="#C9A675" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#2D684D" stop-opacity="0.03" />
    </linearGradient>

    <!-- Soft Filter for Ethereal Botanical Blur -->
    <filter id="soft-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <filter id="dream-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" />
    </filter>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bg-grad)" />

  <!-- Atmospheric Glow Overlays -->
  <rect width="1920" height="1080" fill="url(#sun-glow)" />
  <rect width="1920" height="1080" fill="url(#sage-glow)" />
  <rect width="1920" height="1080" fill="url(#vitality-glow)" />

  <!-- Subtle Ethereal Bokeh / Soft Light Circles in Background -->
  <g opacity="0.6" filter="url(#dream-blur)">
    <circle cx="1650" cy="180" r="160" fill="#E8DEC8" />
    <circle cx="1780" cy="380" r="220" fill="#CFE4D4" />
    <circle cx="200" cy="850" r="240" fill="#D3E7D8" />
    <circle cx="450" cy="980" r="180" fill="#EFE5D3" />
    <circle cx="960" cy="120" r="130" fill="#EBF4EE" />
  </g>

  <!-- Constitutional Balance & Potency Harmonic Rings (Water Ripple / Homeopathic Potency Symbolism) -->
  <g transform="translate(1550, 420)" opacity="0.75">
    <circle cx="0" cy="0" r="380" fill="none" stroke="url(#ring-grad)" stroke-width="1.5" stroke-dasharray="4 8" />
    <circle cx="0" cy="0" r="300" fill="none" stroke="#2D684D" stroke-opacity="0.07" stroke-width="1" />
    <circle cx="0" cy="0" r="220" fill="none" stroke="#C9A675" stroke-opacity="0.12" stroke-width="1.5" />
    <circle cx="0" cy="0" r="140" fill="none" stroke="#2D684D" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="6 6" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="#C9A675" stroke-opacity="0.15" stroke-width="1.5" />
  </g>

  <g transform="translate(180, 880)" opacity="0.6">
    <circle cx="0" cy="0" r="280" fill="none" stroke="url(#ring-grad)" stroke-width="1.2" />
    <circle cx="0" cy="0" r="200" fill="none" stroke="#2D684D" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#C9A675" stroke-opacity="0.1" stroke-width="1" />
  </g>

  <!-- Top-Right Botanical Branch & Eucalyptus Foliage (Apothecary Nature) -->
  <g transform="translate(1920, 0)" opacity="0.85">
    <!-- Main sweeping branch -->
    <path d="M0,0 Q-280,180 -450,420 Q-520,540 -560,680" fill="none" stroke="#265840" stroke-opacity="0.18" stroke-width="3" stroke-linecap="round" />
    <path d="M-220,140 Q-360,240 -410,360" fill="none" stroke="#265840" stroke-opacity="0.14" stroke-width="2" stroke-linecap="round" />
    <path d="M-340,290 Q-480,360 -520,480" fill="none" stroke="#265840" stroke-opacity="0.12" stroke-width="1.8" stroke-linecap="round" />

    <!-- Eucalyptus & Herb Leaves - Cluster 1 -->
    <g transform="translate(-160, 90) rotate(35)">
      <path d="M0,0 C30,-50 90,-45 110,0 C90,45 30,50 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q60,-5 105,0" fill="none" stroke="#1D4A34" stroke-opacity="0.2" stroke-width="1.2" />
    </g>
    <g transform="translate(-240, 160) rotate(55)">
      <path d="M0,0 C35,-60 100,-50 125,0 C100,50 35,60 0,0 Z" fill="url(#leaf-grad-2)" />
      <path d="M0,0 Q70,-5 120,0" fill="none" stroke="#1D4A34" stroke-opacity="0.2" stroke-width="1.2" />
    </g>
    <g transform="translate(-320, 240) rotate(40)">
      <path d="M0,0 C40,-70 120,-60 140,0 C120,60 40,70 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q80,-5 135,0" fill="none" stroke="#1D4A34" stroke-opacity="0.2" stroke-width="1.2" />
    </g>
    <g transform="translate(-390, 310) rotate(70)">
      <path d="M0,0 C30,-55 95,-45 115,0 C95,45 30,55 0,0 Z" fill="url(#gold-leaf-grad)" />
      <path d="M0,0 Q65,-5 110,0" fill="none" stroke="#9A7743" stroke-opacity="0.2" stroke-width="1" />
    </g>
    <g transform="translate(-460, 420) rotate(50)">
      <path d="M0,0 C38,-65 110,-55 130,0 C110,55 38,65 0,0 Z" fill="url(#leaf-grad-2)" />
      <path d="M0,0 Q75,-5 125,0" fill="none" stroke="#1D4A34" stroke-opacity="0.18" stroke-width="1.2" />
    </g>
    <g transform="translate(-500, 520) rotate(65)">
      <path d="M0,0 C32,-50 90,-40 108,0 C90,40 32,50 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q60,-5 104,0" fill="none" stroke="#1D4A34" stroke-opacity="0.16" stroke-width="1" />
    </g>

    <!-- Complementary Opposing Leaves on the branch -->
    <g transform="translate(-190, 110) rotate(-45)">
      <path d="M0,0 C25,-45 80,-40 95,0 C80,40 25,45 0,0 Z" fill="url(#gold-leaf-grad)" />
    </g>
    <g transform="translate(-270, 190) rotate(-35)">
      <path d="M0,0 C30,-55 90,-45 110,0 C90,45 30,55 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q60,-5 105,0" fill="none" stroke="#1D4A34" stroke-opacity="0.18" stroke-width="1.2" />
    </g>
    <g transform="translate(-360, 270) rotate(-25)">
      <path d="M0,0 C35,-60 105,-50 125,0 C105,50 35,60 0,0 Z" fill="url(#leaf-grad-2)" />
      <path d="M0,0 Q70,-5 120,0" fill="none" stroke="#1D4A34" stroke-opacity="0.18" stroke-width="1.2" />
    </g>
    <g transform="translate(-430, 370) rotate(-30)">
      <path d="M0,0 C30,-50 90,-40 105,0 C90,40 30,50 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q60,-5 100,0" fill="none" stroke="#1D4A34" stroke-opacity="0.15" stroke-width="1" />
    </g>
  </g>

  <!-- Bottom-Left Herbal Foliage (Grounded Healing Heritage) -->
  <g transform="translate(0, 1080)" opacity="0.8">
    <!-- Branch rising up -->
    <path d="M0,0 Q180,-200 320,-380 Q400,-480 440,-600" fill="none" stroke="#265840" stroke-opacity="0.15" stroke-width="2.5" stroke-linecap="round" />
    <path d="M140,-150 Q260,-240 310,-330" fill="none" stroke="#265840" stroke-opacity="0.12" stroke-width="1.8" stroke-linecap="round" />

    <!-- Botanical Leaves -->
    <g transform="translate(120, -110) rotate(-55)">
      <path d="M0,0 C30,-55 90,-50 115,0 C90,50 30,55 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q65,-5 110,0" fill="none" stroke="#1D4A34" stroke-opacity="0.18" stroke-width="1.2" />
    </g>
    <g transform="translate(190, -190) rotate(-40)">
      <path d="M0,0 C35,-65 105,-55 130,0 C105,55 35,65 0,0 Z" fill="url(#leaf-grad-2)" />
      <path d="M0,0 Q75,-5 125,0" fill="none" stroke="#1D4A34" stroke-opacity="0.18" stroke-width="1.2" />
    </g>
    <g transform="translate(260, -280) rotate(-60)">
      <path d="M0,0 C28,-50 85,-40 105,0 C85,40 28,50 0,0 Z" fill="url(#gold-leaf-grad)" />
      <path d="M0,0 Q58,-5 100,0" fill="none" stroke="#9A7743" stroke-opacity="0.18" stroke-width="1" />
    </g>
    <g transform="translate(330, -380) rotate(-35)">
      <path d="M0,0 C35,-60 105,-50 125,0 C105,50 35,60 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q70,-5 120,0" fill="none" stroke="#1D4A34" stroke-opacity="0.16" stroke-width="1.2" />
    </g>
    <g transform="translate(390, -480) rotate(-50)">
      <path d="M0,0 C25,-45 75,-35 95,0 C75,35 25,45 0,0 Z" fill="url(#leaf-grad-2)" />
    </g>

    <!-- Branch right side leaves -->
    <g transform="translate(150, -130) rotate(35)">
      <path d="M0,0 C25,-45 80,-40 98,0 C80,40 25,45 0,0 Z" fill="url(#gold-leaf-grad)" />
    </g>
    <g transform="translate(230, -220) rotate(45)">
      <path d="M0,0 C30,-50 90,-45 110,0 C90,45 30,50 0,0 Z" fill="url(#leaf-grad-1)" />
      <path d="M0,0 Q60,-5 105,0" fill="none" stroke="#1D4A34" stroke-opacity="0.16" stroke-width="1" />
    </g>
    <g transform="translate(300, -320) rotate(30)">
      <path d="M0,0 C32,-55 95,-45 118,0 C95,45 32,55 0,0 Z" fill="url(#leaf-grad-2)" />
      <path d="M0,0 Q65,-5 112,0" fill="none" stroke="#1D4A34" stroke-opacity="0.15" stroke-width="1" />
    </g>
  </g>

  <!-- Ambient Light Stems & Floating Pollen / Healing Particles -->
  <g opacity="0.5">
    <circle cx="1480" cy="220" r="2.5" fill="#C9A675" opacity="0.6" />
    <circle cx="1520" cy="260" r="1.5" fill="#2D684D" opacity="0.5" />
    <circle cx="1600" cy="190" r="3" fill="#C9A675" opacity="0.7" />
    <circle cx="1660" cy="310" r="2" fill="#2D684D" opacity="0.5" />
    <circle cx="1410" cy="380" r="2.5" fill="#C9A675" opacity="0.5" />
    <circle cx="1340" cy="290" r="1.8" fill="#2D684D" opacity="0.4" />

    <circle cx="280" cy="780" r="2.5" fill="#C9A675" opacity="0.6" />
    <circle cx="340" cy="720" r="2" fill="#2D684D" opacity="0.5" />
    <circle cx="220" cy="840" r="3" fill="#C9A675" opacity="0.6" />
    <circle cx="420" cy="690" r="1.8" fill="#2D684D" opacity="0.4" />
  </g>

  <!-- Subtle Apothecary Grid / Sacred Geometry Accent in Top Left -->
  <g transform="translate(120, 100)" opacity="0.3">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#C9A675" stroke-width="0.8" />
    <line x1="0" y1="0" x2="0" y2="160" stroke="#C9A675" stroke-width="0.8" />
    <circle cx="0" cy="0" r="4" fill="#C9A675" />
    <circle cx="160" cy="0" r="2.5" fill="#C9A675" />
    <circle cx="0" cy="160" r="2.5" fill="#C9A675" />
    <path d="M0,0 Q120,40 160,160" fill="none" stroke="#2D684D" stroke-width="0.8" stroke-dasharray="2 4" />
  </g>

  <!-- Subtle Apothecary Grid Accent in Bottom Right -->
  <g transform="translate(1800, 980)" opacity="0.3">
    <line x1="-160" y1="0" x2="0" y2="0" stroke="#C9A675" stroke-width="0.8" />
    <line x1="0" y1="-160" x2="0" y2="0" stroke="#C9A675" stroke-width="0.8" />
    <circle cx="0" cy="0" r="4" fill="#C9A675" />
    <circle cx="-160" cy="0" r="2.5" fill="#C9A675" />
    <circle cx="0" cy="-160" r="2.5" fill="#C9A675" />
  </g>
</svg>
